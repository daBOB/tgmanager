name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gates are ordered by how much signal they carry. Lint used to run first
      # and failed, which meant type errors and test failures never got checked
      # at all. Correctness gates now run before style.
      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Compile
        run: bun run build:ts

      - name: Lint
        run: bun run lint

      # Informational: the lockfile is Bun's, so `npm audit` cannot read it.
      - name: Audit dependencies
        run: bun audit || true
